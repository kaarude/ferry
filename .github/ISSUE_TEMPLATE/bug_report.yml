name: Bug report
description: Report broken behavior, crashes, or regressions.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for broken behavior, crashes, or regressions in Ferry.
        Search existing issues first and keep each report focused on one problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I included enough detail to reproduce the problem.
          required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that triggers the bug.
      placeholder: |
        1. Run ...
        2. Trigger ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error messages or stack traces.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: How you run Ferry, your Node.js version, the Ferry version or commit, and whether the AI duplicate check is on.
      placeholder: |
        - Runs on: Docker / pnpm start on Ubuntu 24.04 / ...
        - Node.js: 24.x
        - Ferry version or commit: v0.1.0 or main @ abc1234
        - AI duplicate check: on (claude-opus-5-5) / off
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Logs or screenshots
      description: Optional Ferry console output or Discord screenshots. Remove tokens and private server details first.
