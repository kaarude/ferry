name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Suggest a concrete improvement or new capability for Ferry.
        Start with the problem you hit so we can weigh the simplest fix.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a similar request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is hard, slow, or impossible right now?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, command, or interface you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you considered and why they fell short.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples, links, or mockups.
